# Use Node.js for the build process
image: node:20

# Define the order of operations
stages:
  - test
  - secret-detection
  - deploy

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

sast:
  stage: test

secret_detection:
  stage: secret-detection

# The deployment job
pages:
  stage: deploy
  script:
    - npm install
    - npm run build
    # Vite outputs to 'dist', but GitLab Pages needs 'public'
    - rm -rf public 
    - cp -a dist/. public/ 
  artifacts:
    paths:
      - public
  rules:
    # Only deploy when pushing to the main branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH